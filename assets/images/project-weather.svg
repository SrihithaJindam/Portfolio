<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="weaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#0f2b46" />
    </linearGradient>
    <linearGradient id="weaCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <linearGradient id="weaPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>
    <filter id="weaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="380" fill="url(#weaBg)"/>

  <!-- Wave Grid Background -->
  <g stroke="rgba(100, 255, 218, 0.08)" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
  </g>

  <rect x="30" y="25" width="165" height="30" rx="15" fill="rgba(100, 255, 218, 0.12)" stroke="rgba(100, 255, 218, 0.4)" stroke-width="1"/>
  <text x="112" y="45" fill="#64ffda" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" text-anchor="middle">METEOROLOGY AI</text>

  <text x="560" y="45" fill="rgba(255,255,255,0.3)" font-family="'Poppins', sans-serif" font-size="12" text-anchor="end">Autoencoders + k-NN</text>

  <!-- Autoencoder Architecture schema -->
  <g transform="translate(60, 95)">
    <!-- Input layer nodes -->
    <circle cx="20" cy="30" r="10" fill="#64ffda"/>
    <circle cx="20" cy="65" r="10" fill="#64ffda"/>
    <circle cx="20" cy="100" r="10" fill="#64ffda"/>
    <circle cx="20" cy="135" r="10" fill="#64ffda"/>

    <!-- Hidden compressed layer (Bottleneck) -->
    <circle cx="120" cy="50" r="8" fill="#00b4d8"/>
    <circle cx="120" cy="115" r="8" fill="#00b4d8"/>

    <!-- Latent Code -->
    <circle cx="200" cy="82" r="12" fill="#ff007f" filter="url(#weaGlow)"/>
    <text x="200" y="115" fill="#ff007f" font-family="'Poppins', sans-serif" font-size="10" text-anchor="middle" font-weight="600">Latent Space</text>

    <!-- Decoder layer -->
    <circle cx="280" cy="50" r="8" fill="#00b4d8"/>
    <circle cx="280" cy="115" r="8" fill="#00b4d8"/>

    <!-- Output layer -->
    <circle cx="370" cy="30" r="10" fill="#64ffda"/>
    <circle cx="370" cy="65" r="10" fill="#64ffda"/>
    <circle cx="370" cy="100" r="10" fill="#64ffda"/>
    <circle cx="370" cy="135" r="10" fill="#64ffda"/>

    <!-- Connections -->
    <path d="M20 30 L120 50 M20 65 L120 50 M20 100 L120 115 M20 135 L120 115" stroke="rgba(100, 255, 218, 0.3)" stroke-width="1.5"/>
    <path d="M120 50 L200 82 M120 115 L200 82" stroke="rgba(255, 0, 127, 0.4)" stroke-width="1.5"/>
    <path d="M200 82 L280 50 M200 82 L280 115" stroke="rgba(255, 0, 127, 0.4)" stroke-width="1.5"/>
    <path d="M280 50 L370 30 M280 50 L370 65 M280 115 L370 100 M280 115 L370 135" stroke="rgba(100, 255, 218, 0.3)" stroke-width="1.5"/>
  </g>

  <!-- Anomaly threshold radar / waveform -->
  <g transform="translate(60, 230)">
    <rect x="0" y="0" width="480" height="60" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.08)"/>
    <path d="M 10 35 Q 40 30 70 35 T 130 35 T 190 35 Q 220 5 240 50 T 270 35 T 330 35 T 390 35 T 450 35" fill="none" stroke="#64ffda" stroke-width="2"/>
    <!-- Anomaly Alert Indicator -->
    <circle cx="230" cy="20" r="6" fill="#ff007f" filter="url(#weaGlow)"/>
    <text x="250" y="24" fill="#ff007f" font-family="'Poppins', sans-serif" font-size="11" font-weight="600">ANOMALY DETECTED (Early Warning)</text>
  </g>

  <!-- Tech tags -->
  <g transform="translate(40, 320)">
    <rect x="0" y="0" width="95" height="26" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="47" y="17" fill="#ccc" font-family="'Poppins', sans-serif" font-size="11" text-anchor="middle">Deep Learning</text>
    
    <rect x="105" y="0" width="90" height="26" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="150" y="17" fill="#ccc" font-family="'Poppins', sans-serif" font-size="11" text-anchor="middle">Autoencoders</text>

    <rect x="205" y="0" width="70" height="26" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="240" y="17" fill="#ccc" font-family="'Poppins', sans-serif" font-size="11" text-anchor="middle">k-NN</text>

    <rect x="285" y="0" width="90" height="26" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="330" y="17" fill="#ccc" font-family="'Poppins', sans-serif" font-size="11" text-anchor="middle">Scikit-Learn</text>
  </g>
</svg>