<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="terBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="100%" stop-color="#203a43" />
    </linearGradient>
    <linearGradient id="terEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#terBg)"/>

  <rect x="30" y="25" width="175" height="30" rx="15" fill="rgba(56, 239, 125, 0.15)" stroke="rgba(56, 239, 125, 0.4)" stroke-width="1"/>
  <text x="117" y="45" fill="#38ef7d" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" text-anchor="middle">PEER-REVIEWED PAPER</text>

  <text x="560" y="45" fill="rgba(255,255,255,0.4)" font-family="'Poppins', sans-serif" font-size="12" text-anchor="end">IJRTI Journal (Vol 8, Issue 10)</text>

  <!-- 3D Contour terrain lines -->
  <g transform="translate(50, 75)">
    <path d="M 20 160 Q 120 80 250 120 T 480 60" fill="none" stroke="rgba(56, 239, 125, 0.2)" stroke-width="2"/>
    <path d="M 20 140 Q 140 60 270 100 T 480 40" fill="none" stroke="rgba(56, 239, 125, 0.35)" stroke-width="2"/>
    <path d="M 20 120 Q 150 40 290 80 T 480 20" fill="none" stroke="rgba(56, 239, 125, 0.55)" stroke-width="2.5"/>
    <path d="M 20 100 Q 160 20 310 60 T 480 10" fill="none" stroke="#38ef7d" stroke-width="3"/>
    
    <!-- Extraction points -->
    <circle cx="160" cy="50" r="5" fill="#ffb703"/>
    <circle cx="310" cy="60" r="5" fill="#ffb703"/>
    <circle cx="410" cy="35" r="5" fill="#ffb703"/>
  </g>

  <!-- Paper Title Badge -->
  <g transform="translate(50, 190)">
    <rect x="0" y="0" width="500" height="95" rx="12" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="30" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="13" font-weight="600">Optimizing Nature's Blueprint: Hybrid Terrain Extraction</text>
    <text x="20" y="52" fill="#a0aec0" font-family="'Poppins', sans-serif" font-size="11">Comparative study of hybrid computer vision algorithms for feature extraction</text>
    <text x="20" y="74" fill="#38ef7d" font-family="'Poppins', sans-serif" font-size="10" font-weight="500">Indexed on Zenodo • DOI: 10.5281/zenodo.10101567</text>
  </g>

  <!-- Tags -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="130" height="26" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="65" y="17" fill="#ccc" font-family="'Poppins', sans-serif" font-size="11" text-anchor="middle">Computer Vision</text>
    
    <rect x="140" y="0" width="140" height="26" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="210" y="17" fill="#ccc" font-family="'Poppins', sans-serif" font-size="11" text-anchor="middle">Terrain Analysis</text>

    <rect x="290" y="0" width="130" height="26" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="355" y="17" fill="#ccc" font-family="'Poppins', sans-serif" font-size="11" text-anchor="middle">Hybrid Modeling</text>
  </g>
</svg>